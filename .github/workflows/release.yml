# 筛图大师 · 三平台自动打包（需求⑨：每台设备自带 Python，免安装即完整 12 维）
#
# 触发方式：
#   1) 推送到 GitHub 后，在 Actions 页面点「Run workflow」手动触发（workflow_dispatch）
#   2) 打 tag（如 v2.0.0）并推送，自动构建并发布到 GitHub Release
#
# 云端会用真实的 Windows / macOS(arm64) / macOS(x64) 三种 runner，各自：
#   - 装 Python 3.11 → npm run build:engine（PyInstaller 产出自带引擎 engine-dist/<平台>）
#   - npm run build（electron-vite）
#   - electron-builder 出对应平台安装包（extraResources 已把 engine-dist 打进 resources/engine）
# 产物：ScreenerMaster-*-Setup.exe（Win）、ScreenerMaster-*-arm64.dmg、ScreenerMaster-*-x64.dmg
name: Build Release Installers

on:
  workflow_dispatch:
    inputs:
      buildWin:
        description: '构建 Windows 安装包'
        type: boolean
        default: true
      buildMacArm:
        description: '构建 macOS arm64 (Apple Silicon)'
        type: boolean
        default: true
      buildMacX64:
        description: '构建 macOS x64 (Intel)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

env:
  # 未配置 Apple 签名证书时跳过签名（未签名分发，客户按 DMG 内附的一键修复脚本放行）。
  # 拿到开发者账号后：在仓库 Settings → Secrets → Actions 里配齐下面 5 个 Secret，
  # 流水线会自动切换为 Developer ID 签名 + 苹果公证，客户双击直装零提示，无需改任何代码：
  #   APPLE_CERT_P12_BASE64   —— Developer ID Application 证书导出的 p12 转 base64（mac 上 base64 -i cert.p12）
  #   APPLE_CERT_PASSWORD     —— 导出 p12 时设的密码
  #   APPLE_ID                —— 开发者 Apple ID（邮箱）
  #   APPLE_APP_SPECIFIC_PASSWORD —— appleid.apple.com 生成的 App 专用密码
  #   APPLE_TEAM_ID           —— 团队 ID（开发者后台 Membership 页）
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

defaults:
  run:
    working-directory: app

jobs:
  # ---------------- Windows ----------------
  windows:
    if: ${{ github.event_name == 'push' || inputs.buildWin }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 JS 依赖
        run: npm ci
      - name: 拉取开源 ONNX 权重（YuNet 人脸检测；失败则硬失败，避免静默降级）
        run: npm run fetch-models
      - name: 构建自带 Python AI 引擎（PyInstaller）
        run: npm run build:engine
      - name: 引擎自检（硬门禁：mediapipe/人体模型/端到端任一不通就不出包，绝不发降级引擎）
        shell: bash
        run: |
          mkdir -p engine-dist/win/tests/fixtures
          cp ../ai-engine/tests/fixtures/*.jpg engine-dist/win/tests/fixtures/ 2>/dev/null || true
          ./engine-dist/win/screener-engine.exe --selfcheck
      - name: 构建前端与主进程（electron-vite，产出 out/）
        run: npm run build
      - name: 打包 Windows 安装包
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            app/release/*.exe
            app/release/*.exe.blockmap
          if-no-files-found: error

  # ---------------- macOS Apple Silicon (arm64) ----------------
  macos-arm64:
    if: ${{ github.event_name == 'push' || inputs.buildMacArm }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 JS 依赖
        run: npm ci
      - name: 拉取开源 ONNX 权重（YuNet 人脸检测；失败则硬失败，避免静默降级）
        run: npm run fetch-models
      - name: 构建自带 Python AI 引擎（PyInstaller, arm64）
        run: npm run build:engine
      - name: 引擎自检（硬门禁：降级引擎一律不发）
        run: |
          mkdir -p engine-dist/mac/tests/fixtures
          cp ../ai-engine/tests/fixtures/*.jpg engine-dist/mac/tests/fixtures/ 2>/dev/null || true
          ./engine-dist/mac/screener-engine --selfcheck
      - name: 构建前端与主进程（electron-vite，产出 out/）
        run: npm run build
      - name: 打包 macOS arm64 DMG（配了签名 Secrets 则自动签名+公证，否则维持未签名）
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          ARGS=""
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_CERT_P12_BASE64" ]; then
            export CSC_LINK="$APPLE_CERT_P12_BASE64" CSC_KEY_PASSWORD="$APPLE_CERT_PASSWORD"
            unset CSC_IDENTITY_AUTO_DISCOVERY
            ARGS="--config.mac.notarize.teamId=$APPLE_TEAM_ID"
            echo "已启用 Developer ID 签名 + 公证"
          else
            echo "未配置苹果签名证书，产出未签名包（客户需按 DMG 内一键修复脚本操作）"
          fi
          npx electron-builder --mac --arm64 --publish never $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            app/release/*arm64.dmg
            app/release/*.dmg.blockmap
          if-no-files-found: error

  # ---------------- macOS Intel (x64) ----------------
  macos-x64:
    if: ${{ github.event_name == 'push' || inputs.buildMacX64 }}
    # macos-13 已于 2025-12-04 退役（会无限排队而非报错，进而卡死依赖它的 release job）。
    # macos-15-intel 是 GitHub 官方的 x86_64 替代标签，预计 2027 秋随 macOS 15 镜像退役。
    # 若不再需要支持 Intel Mac，可整段删除本 job 并从下方 release.needs 移除 macos-x64，构建更快。
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 JS 依赖
        run: npm ci
      - name: 拉取开源 ONNX 权重（YuNet 人脸检测；失败则硬失败，避免静默降级）
        run: npm run fetch-models
      - name: 构建自带 Python AI 引擎（PyInstaller, x64）
        run: npm run build:engine
      - name: 引擎自检（硬门禁：降级引擎一律不发；Intel Mac 固定 mediapipe 0.10.21，与 Win/arm 的 1.1.0 不同属官方无包所致）
        run: |
          mkdir -p engine-dist/mac/tests/fixtures
          cp ../ai-engine/tests/fixtures/*.jpg engine-dist/mac/tests/fixtures/ 2>/dev/null || true
          ./engine-dist/mac/screener-engine --selfcheck
      - name: 构建前端与主进程（electron-vite，产出 out/）
        run: npm run build
      - name: 打包 macOS x64 DMG（配了签名 Secrets 则自动签名+公证，否则维持未签名）
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          ARGS=""
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_CERT_P12_BASE64" ]; then
            export CSC_LINK="$APPLE_CERT_P12_BASE64" CSC_KEY_PASSWORD="$APPLE_CERT_PASSWORD"
            unset CSC_IDENTITY_AUTO_DISCOVERY
            ARGS="--config.mac.notarize.teamId=$APPLE_TEAM_ID"
            echo "已启用 Developer ID 签名 + 公证"
          else
            echo "未配置苹果签名证书，产出未签名包（客户需按 DMG 内一键修复脚本操作）"
          fi
          npx electron-builder --mac --x64 --publish never $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: |
            app/release/*-x64.dmg
            app/release/*.dmg.blockmap
          if-no-files-found: error

  # ---------------- 汇总发布 GitHub Release（仅打 tag 时） ----------------
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [windows, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            筛图大师安装包（三平台）。均已内置完整 12 维 Python AI 引擎，用户机无需安装 Python。
            - Windows：ScreenerMaster-*-Setup.exe
            - macOS Apple 芯片（M1/M2/M3/M4）：ScreenerMaster-*-arm64.dmg
            - macOS Intel（老款）：ScreenerMaster-*-x64.dmg

            macOS 安装提示：拖进「应用程序」后若提示"已损坏/无法打开"，双击 DMG 窗口内的「打不开请双击我.command」一键修复（首次需右键→打开）。详见 docs/安装教程-macOS.md。
            已配置开发者证书时本包会自动签名+公证，可直接双击安装、无任何提示。
